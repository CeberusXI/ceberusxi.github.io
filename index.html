<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fight Camp 13</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: floor-tape motif. A 13-week tape measure across the top, section heads with tick marks, tabs as a scrolling strip. */
:root{
 --bg:#EFF1EC; --panel:#FFFFFF; --wash:#E4E8E1; --ink:#13191D; --dim:#566069; --faint:#7C858D; --line:#D0D6CE;
 --accent:#1D4ED8; --accent-ink:#FFFFFF; --tape:#E0A800; --tape-ink:#2A2000;
 --ok:#1B7A48; --warn:#9A5A0B; --bad:#B02A24;
 --disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
 --body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){
  --bg:#0D1217; --panel:#151C23; --wash:#1B242D; --ink:#E7EBEE; --dim:#9AA5AE; --faint:#6E7A84; --line:#25303A;
  --accent:#7FA2FF; --accent-ink:#0A1226; --tape:#F2C230; --tape-ink:#231A00;
  --ok:#5BC48C; --warn:#E3A24A; --bad:#EE7B73; color-scheme:dark;
 }
}
:root[data-theme="dark"]{
 --bg:#0D1217; --panel:#151C23; --wash:#1B242D; --ink:#E7EBEE; --dim:#9AA5AE; --faint:#6E7A84; --line:#25303A;
 --accent:#7FA2FF; --accent-ink:#0A1226; --tape:#F2C230; --tape-ink:#231A00;
 --ok:#5BC48C; --warn:#E3A24A; --bad:#EE7B73; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--disp);font-weight:800;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
p{margin:0}
.app{max-width:880px;margin:0 auto;padding:0 16px 64px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:.02em;text-transform:uppercase;line-height:.9}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.06em;color:var(--dim);margin-top:6px;text-transform:none}
.themebtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;font-family:var(--mono);font-size:11px;cursor:pointer}
.tape{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;margin-block:6px 4px}
.seg{height:14px;background:var(--wash);border:1px solid var(--line);position:relative}
.seg.done{background:var(--ink);border-color:var(--ink)}
.seg.cur{background:var(--tape);border-color:var(--tape)}
.seg.test::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 3px,var(--tape-ink) 3px 4px);opacity:.55}
.seg.p1{border-bottom-width:3px}
.tapelbl{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;font-family:var(--mono);font-size:9.5px;color:var(--faint);text-align:center}
.tapemeta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:8px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;overflow-x:auto;gap:2px;border-bottom:1px solid var(--line);margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;padding:11px 12px 9px;font-family:var(--disp);font-weight:800;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--dim);cursor:pointer;border-bottom:3px solid transparent}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--tape)}
main{padding-top:20px;display:flex;flex-direction:column;gap:30px}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec>h2{font-size:26px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sec>h2::after{content:"";flex:1;height:7px;background:repeating-linear-gradient(90deg,var(--tape) 0 2px,transparent 2px 10px);opacity:.85;min-width:20px}
.sec>h3{font-size:19px;text-transform:uppercase;color:var(--ink)}
.dim{color:var(--dim)} .mono{font-family:var(--mono)}
.lead{color:var(--dim);max-width:68ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);min-width:0}
th{font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);background:var(--wash);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.nw{white-space:nowrap}
tr.hl td{background:color-mix(in srgb,var(--tape) 16%,transparent)}
.minw{min-width:720px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.tape{background:var(--tape);border-color:var(--tape);color:var(--tape-ink);font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.ghost{background:transparent;color:var(--dim)}
.btn:focus-visible,nav.tabs button:focus-visible,.ck:focus-visible,.chip:focus-visible,.themebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tg{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.05em;padding:2px 7px;border-radius:4px;border:1px solid currentColor;margin-top:4px;background:color-mix(in srgb,currentColor 10%,transparent)}
.tg-s{color:var(--ok)} .tg-m{color:var(--accent)} .tg-p{color:var(--warn)} .tg-c{color:var(--bad)} .tg-g{color:var(--faint)}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:3px 8px;border-radius:99px;background:var(--wash);color:var(--dim)}
.pill.tp{background:var(--tape);color:var(--tape-ink)}
.hero{display:flex;flex-direction:column;gap:6px}
.hero .day{font-family:var(--disp);font-weight:800;font-size:56px;line-height:.9;text-transform:uppercase}
.hero .day span{color:var(--faint);font-size:24px}
.sess{display:flex;flex-direction:column;gap:4px}
.blk{margin-top:18px}
.blk h4{font-size:14px;font-family:var(--mono);font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);padding-bottom:6px;border-bottom:1px solid var(--line)}
.blk.opt h4{color:var(--warn)}
.ex{border-bottom:1px solid var(--line)}
.ex-row{display:flex;gap:12px;align-items:flex-start;padding:11px 0}
.ck{flex:0 0 auto;width:26px;height:26px;border-radius:6px;border:2px solid var(--faint);background:transparent;color:transparent;cursor:pointer;font-weight:800;line-height:1;margin-top:2px}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ex-main{flex:1;min-width:0}
.ex-name{font-weight:600}
.ex-name.dn{color:var(--dim);text-decoration:line-through}
.ex-spec{font-family:var(--mono);font-size:12px;color:var(--accent)}
.ex-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ex-cue{display:none;padding:0 0 12px 38px;color:var(--dim);font-size:13.5px}
.ex-cue.open,.ex-cue.static{display:block}
.ex-cue.static{padding-left:0;font-size:13px}
.ex.static .ex-row{padding-bottom:4px}
.bar{height:6px;background:var(--wash);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.rdy{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rdy label,.fld label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
select,input[type=number],input[type=text],textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 9px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.st{padding:12px 14px;border-radius:8px;border:1px solid currentColor;background:color-mix(in srgb,currentColor 9%,transparent)}
.st b{font-family:var(--disp);font-size:22px;letter-spacing:.04em}
.st.GREEN{color:var(--ok)} .st.YELLOW{color:var(--warn)} .st.RED{color:var(--bad)}
.st p{color:var(--ink);font-size:13.5px;margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;cursor:pointer;font-family:var(--mono);font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.t{border-color:var(--tape)}
.rpe{display:flex;gap:4px;flex-wrap:wrap}
.rpe button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-family:var(--mono)}
.rpe button[aria-pressed="true"]{background:var(--tape);color:var(--tape-ink);border-color:var(--tape);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .c{aspect-ratio:1.25;max-width:100%;border:1px solid var(--line);border-radius:4px;background:var(--wash);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--faint)}
.cal .c.d{background:var(--ok);border-color:var(--ok);color:#fff}
.cal .c.n{outline:2px solid var(--tape);outline-offset:1px;color:var(--ink)}
.cal .wl{grid-column:1/-1;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat b{display:block;font-family:var(--disp);font-size:34px;line-height:1}
.stat span{font-size:11.5px;color:var(--dim)}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px}
.bars div{flex:1;background:var(--wash);display:flex;align-items:flex-end;height:100%}
.bars div i{display:block;width:100%;background:var(--accent)}
.bars div.dl i{background:var(--tape)}
details.day{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
details.day>summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;list-style:none}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary b{font-family:var(--disp);font-size:20px;text-transform:uppercase}
details.day .inner{padding:0 14px 14px}
details.day>summary:focus-visible{outline:2px solid var(--accent)}
.skill{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.skill>summary{cursor:pointer;padding:11px 14px;font-family:var(--disp);font-weight:800;font-size:19px;text-transform:uppercase;list-style:none}
.skill>summary::-webkit-details-marker{display:none}
.skill .st4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.skill .st4 div{background:var(--panel);padding:10px 14px;font-size:13px}
.skill .st4 b{display:block;font-family:var(--mono);font-weight:500;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
.tin{width:78px;padding:6px 7px;font-family:var(--mono)}
.fld{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fld .wide{grid-column:1/-1}
ol.rules{margin:0;padding-left:0;list-style:none;counter-reset:r;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px}
ol.rules li{counter-increment:r;display:flex;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
ol.rules li::before{content:counter(r);font-family:var(--disp);font-weight:800;font-size:24px;line-height:1;color:var(--tape);min-width:26px}
#tmOv{display:none;position:fixed;inset:0;z-index:60;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--bg);overflow-y:auto}
#tmOv.open{display:flex}
#tmOv.work{background:color-mix(in srgb,var(--ok) 22%,var(--bg))}
#tmOv.rest{background:color-mix(in srgb,var(--accent) 20%,var(--bg))}
#tmOv.ready{background:color-mix(in srgb,var(--tape) 22%,var(--bg))}
.tm-name{color:var(--dim);font-size:14px;max-width:34ch}
.tm-phase{font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:.08em;margin-top:10px}
.tm-clock{font-family:var(--disp);font-weight:800;font-size:min(34vw,160px);line-height:1;margin:6px 0;font-variant-numeric:tabular-nums}
.tm-cue{font-family:var(--disp);font-weight:800;font-size:min(11vw,52px);line-height:1.05;min-height:2.2em;max-width:16ch;text-transform:uppercase}
.tm-map{font-size:12.5px;color:var(--dim);max-width:46ch;margin-top:6px}
.tm-ctrl{display:flex;gap:10px;margin-top:22px;width:100%;max-width:400px}
.tm-ctrl button{flex:1;height:54px}
.flag{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-200%);background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:12px;padding:6px 14px;border-radius:99px;z-index:70;transition:transform .3s}
.flag.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.flag{transition:none}}
@media (max-width:520px){.brand{font-size:28px}.hero .day{font-size:46px}.ex-row{flex-wrap:wrap}.ex-btns{width:100%;justify-content:flex-start;padding-left:38px}}
</style>

<body>
<div class="app">
 <header class="top">
  <div class="brand">Fight Camp 13<small>13 weeks · home · solo · no bags, pads or partners</small></div>
  <button class="themebtn" id="themeBtn" type="button">Theme: auto</button>
 </header>
 <div id="tapeWrap"></div>
 <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
 <main id="view"></main>
</div>
<div id="tmOv" role="dialog" aria-label="Round timer">
 <div class="tm-name" id="tmName"></div>
 <div class="tm-phase" id="tmPhase"></div>
 <div class="tm-clock" id="tmClock"></div>
 <div id="tmRound" class="dim mono"></div>
 <div class="tm-cue" id="tmCue"></div>
 <div class="tm-map" id="tmMap"></div>
 <div class="tm-ctrl"><button class="btn" id="tmRestart" type="button">Restart</button><button class="btn pri" id="tmPause" type="button">Pause</button><button class="btn" id="tmSkip" type="button">Skip</button></div>
 <div class="row" style="margin-top:14px;justify-content:center"><button class="btn sm ghost" id="tmSnd" type="button">Sound: on</button><button class="btn sm ghost" id="tmVoice" type="button">Voice: on</button><button class="btn sm ghost" id="tmClose" type="button">Close timer</button></div>
</div>
<div class="flag" id="flag" role="status">Saved</div>

<script>
(function(){
'use strict';
const TG={s:"SOLO — HOME",m:"MINIMAL EQUIPMENT — HOME",p:"PARTNER REQUIRED",c:"COACH REQUIRED",g:"GYM OPTIONAL"};
const PHN=["Foundation","Development","Intensification","Integration"];
const PHW=["Weeks 1–3 + deload 4","Weeks 5–7 + deload 8","Weeks 9–11 + deload 12","Week 13"];
const TESTW=[1,4,8,12,13];

const CUES={
 choice:{n:"A / B choice",list:["A","B"],map:"Before the round decide: A = one attack, B = a different attack. Commit within one second of the call."},
 choice3:{n:"A / B / C choice",list:["A","B","C"],map:"Before the round decide three different answers. Commit within one second of the call."},
 defence:{n:"Defence only",list:["RED · parry","BLUE · slip","GREEN · cover","YELLOW · check","WHITE · pivot out"],map:"RED parry. BLUE slip. GREEN cover. YELLOW lift the shin check. WHITE pivot out. Choose your own counter."},
 defc:{n:"Defence + counter",list:["RED · parry + cross","BLUE · slip + hook","GREEN · cover + low kick","YELLOW · check + cross","WHITE · pivot out + reset"],map:"RED parry then cross. BLUE slip then lead hook. GREEN cover then low kick. YELLOW check then cross. WHITE pivot out and reset."},
 dca:{n:"Defence, counter, angle",list:["RED · parry, cross, step out","BLUE · slip, hook, pivot left","GREEN · cover, low kick, pivot right","YELLOW · check, cross, exit 45°","WHITE · pivot out, reset"],map:"Each colour is a three-step answer: defend, counter, then change your angle. Finish every sequence on a new line."},
 fcc:{n:"Feint, reaction, counter",list:["FEINT · he covers → body kick","FEINT · he steps back → teep","FEINT · he steps in → pivot and counter","FEINT · he counters → parry and cross","FEINT · he freezes → 1-2-low kick"],map:"Throw a real feint, imagine the reaction named, and punish it with the answer shown."},
 range:{n:"Range calls",list:["LONG · teeps and kicks","MID · punches","CLOSE · knees and short shots","BREAK · step out"],map:"Match your offence to the range called. BREAK means leave on an angle."},
 opp:{n:"Opponent style",list:["PRESSURE · walks you down","COUNTER-PUNCHER · waits","KICKER · stays long","CLINCHER · grabs and smothers","RETREATER · steps back"],map:"Imagine that opponent for as long as the call stands. Change your plan within 2 seconds."},
 press:{n:"Pressure scenarios",list:["PRESSURE · he walks you down","PRESSURE · he throws jab-cross","PRESSURE · he kicks low","PRESSURE · he clinches","PRESSURE · he feints, then steps in"],map:"You are being pressured. Hold your ground, defend, pivot out and counter. Never retreat in a straight line."},
 retreat:{n:"Retreating opponent",list:["HE BACKS STRAIGHT · cut the angle","HE CIRCLES LEFT · cut him off","HE CIRCLES RIGHT · cut him off","HE HITS THE CORNER · finish","HE COUNTERS · defend, then re-cut"],map:"You are the hunter. Cut the ring with small steps and strike when he runs out of room."},
 fat:{n:"Fatigue management",list:["FATIGUE · hands up, long exhale","BURST · 6 s clean and fast","SLOW · drop to RPE 5, keep guard","PRESSURE · hold your ground, pivot","RESET · breathe, plan, go"],map:"Obey each call at once. The goal is clean technique and a clear decision while you are tired."},
 tempo:{n:"Burst / cruise",list:["BURST","CRUISE"],map:"BURST = 6 seconds near-max with clean form. CRUISE = technical flow at RPE 5–6."},
 entry:{n:"Footwork calls",list:["ENTER","EXIT","ANGLE LEFT","ANGLE RIGHT","PIVOT"],map:"Move on the call, then throw one strike from the new position."},
 plan:{n:"Game plan",list:["PLAN A · pressure","PLAN B · range kicks","SWITCH PLAN","MISTAKE · reset breath","FATIGUE · hands up, breathe"],map:"Run your chosen plan. Obey every call at once."},
 jdir:{n:"Jump direction",list:["JUMP FORWARD · stick","JUMP LEFT · stick","JUMP RIGHT · stick","JUMP BACK · stick"],map:"Jump on the call and freeze the landing for 2 s. If you wobble, rest longer before the next one."}
};

const WARM={
 mon:["Bounce and ankle hops|3:00|s|Light bounce on the balls of the feet.","Hip circles, leg swings, thoracic rotations|2:00|s|10 each direction. Build range gradually.","Slow shadow round, jab only, then add slow kick chambers|1 × 2:00 at RPE 3|s|Move your feet, keep the guard up."],
 tue:["Glute bridge, bird-dog, bodyweight squat|2 × 8|s|Wake up hips and trunk before loaded work.","Ramp-up sets of the first two lifts|1 × 6 each at half load|m|Rehearse A1 and B1 light. No grinding in the first set."],
 wed:["Footwork warm-up: shuffle, skip, pivot|3:00|s|Stay light. Feet never cross.","Slow shadow round with exits and parries|1 × 2:00 at RPE 3|s|Jab, step off the line, parry the imagined return."],
 thu:["Easy walk or cycle|15:00 at RPE 2|s|Nose-breathing pace. This is the recovery stimulus. Do not turn it into a workout."],
 fri:["Ankle bounces, A-skips, pogo hops|3:00|s|Springy ankles, quiet landings.","Two practice jumps at 70 percent|2 reps|s|Land softly, knees tracking over toes.","Shadow round, build to RPE 5|1 × 2:00|s|Speed up over the last 30 s."],
 sat:["Mobility flow and light bounce|4:00|s|Hips, ankles, thoracic spine.","Shadow rounds building RPE 3 to 5|2 × 2:00|s|Slow in round one, match speed by the end of round two."],
 sun:["Easy walk|20–30 min at RPE 2|s|Outdoors if possible. Easy enough to hold a conversation."]
};
const COOL={
 mon:"Easy walk, then hip-flexor, hamstring, calf and adductor stretch|6:00|s|Gentle, no pain. Exhale slowly.",
 tue:"Easy walk, then calf, quad, glute and chest stretch|8:00|s|Loaded single-leg work leaves calves and hips tight. Walk until you can nose-breathe.",
 wed:"Easy walk, then hip and ankle mobility|6:00|s|Footwork volume shows up in the ankles first.",
 thu:"Gentle breathing, 4 s in, 6 s out|4:00|s|Lie on your back, legs on a chair if comfortable.",
 fri:"Slow walk until breathing settles, then stretch|10:00|s|Keep walking until you can nose-breathe. Then hips, calves, shoulders.",
 sat:"Walk, stretch, then watch your filmed rounds|8:00|s|Replay is in the scenario block. This is the cool-down for the body.",
 sun:"Prepare next week|10:00|s|Charge the phone, clear the floor space, lay out the range lines, choose a film clip for Thursday."

const AUDIT=[
 ["1 · What it did well","Consistent daily structure you could actually follow. A deload every fourth week. Mobility, balance and eyes-closed single-leg work (rare in home programs). A daily mental routine. A film-study slot. An honest warning against hard shin conditioning. Per-exercise timers and cues. These stay."],
 ["2 · Unnecessarily repetitive","Two session templates covered 112 days. Technical + Power ran three times a week and Conditioning + Mobility ran three times a week, with the same exercises in the same order for 16 weeks. Week 1 and Week 16 asked for the same movements."],
 ["3 · Progression that depended on volume","Every change was a lookup table of numbers: rounds 5→8, kick reps 15→22, burpees 10→15, plank 45→90 s, sprint rest 90→45 s. Nothing new was learned after Week 1. That is workload progression, not skill progression."],
 ["4 · Poor transfer to kickboxing","Burpees at 15 reps (general fatigue, not kick-specific). Russian twists at 30 reps (low value, spinal flexion). Leg raises and 90-second planks (diminishing returns past 30–45 s). Jump squats at 22 reps (reps destroy the quality that makes them power work). Sprinting in place and mountain climbers as conditioning (not fighting rhythm)."],
 ["5 · Underdeveloped skills","No hooks or uppercuts, no knees, no clinch. Defence was a sentence in the shadowboxing cue. No parry, slip or check drills. No feints, no counters, no angle work, no distance training. No reaction or decision training at all."],
 ["6 · Weekly structure","Six training days with identical hard days is a poor stress pattern for a 3-month novice. High-impact work (jump squats, plyo lunges, burpees, sprints) ran six days a week. There was no easy training day, only a rest day. A ‘Technical + Power’ day that mixed 8 rounds of shadow with plyometrics hid the fact that neither was done fresh."],
 ["7 · Strength and conditioning","General fitness circuit, not fighter preparation. No hinge or posterior-chain loading beyond glute bridges, no calf or ankle work, no rotation or anti-rotation, no loading progression beyond reps. No aerobic base. Conditioning was only anaerobic sprints."],

function perfFlag(){
 const ds=Object.keys(S.logs).map(Number).filter(d=>S.logs[d].at&&S.logs[d].rpe>0&&d<S.day).sort((a,b)=>b-a).slice(0,2);
 if(ds.length<2)return false;
 return ds.every(d=>{const s=sess(d);return S.logs[d].rpe-s.rpe>=2});
}
function rdyCalc(r){
 if(!r)return null;
 const sc=(r.sl|0)+(r.so|0)+(r.en|0)+(r.mo|0)+(r.hr|0);
 let st='GREEN';const why=[];
 if(r.rf){st='RED';why.push('red-flag symptom')}
 if(r.pn>=2){st='RED';why.push('pain that changes movement')}
 if(r.so>=3){st='RED';why.push('severe soreness')}
 if(sc>=9){st='RED';why.push('score '+sc)}
 if(st!=='RED'){
  if(sc>=5){st='YELLOW';why.push('score '+sc)}
  if(r.pn===1){st='YELLOW';why.push('mild pain')}
  if(perfFlag()){st='YELLOW';why.push('last two sessions ran 2+ RPE over plan')}
 }
 return {sc,st,why};
}
const RDYTXT={GREEN:'Run the session as written.',YELLOW:'Drop one set or round from every block (about a third). Cap effort at RPE 6. No max-effort or maximal jumps. Keep all technique work and the mental routine.',RED:'Replace today with recovery: 20 min walk, the Thursday mobility circuit and 10 min of breathing. If RED two days running, or pain lasts over 72 hours, speak to a coach, physio or doctor. Dizziness, nausea, headache or confusion after a head knock: stop and get medical help.'};

function streaks(){
 const ds=new Set(Object.values(S.logs).filter(l=>l.at&&l.date).map(l=>l.date));
 let cur=0;const c=new Date();
 if(!ds.has(ld(c)))c.setDate(c.getDate()-1);
 while(ds.has(ld(c))){cur++;c.setDate(c.getDate()-1)}
 const arr=[...ds].sort();let best=0,run=0,prev=null;
 arr.forEach(s=>{
  const d=new Date(s+'T00:00:00');
  if(prev&&Math.round((d-prev)/86400000)===1)run++;else run=1;
  best=Math.max(best,run);prev=d;
 });
 return {cur,best:Math.max(best,cur)};
}

let TM=null,tick=null,snd=true,voice=true,ctx=null,lock=null;
function beep(f,ms){
 if(!snd)return;
 try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.value=.25;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+ms/1000)}catch(e){}
 try{if(navigator.vibrate)navigator.vibrate(ms>300?[200,80,200]:60)}catch(e){}
}
function say(t){
 if(!voice)return;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/·/g,',').replace(/[+→]/g,' then ').toLowerCase());u.rate=1.1;speechSynthesis.speak(u)}catch(e){}
}
const fmt=t=>Math.floor(t/60)+':'+pad(t%60);
function tmStart(ph,round,dur){
 TM.ph=ph;TM.round=round;TM.end=Date.now()+dur*1000;TM.lastSec=null;TM.paused=false;
 TM.show='';TM.cue='BURST';
 const t=TM.it.timer;
 if(ph==='work'&&t.cue){TM.cueAt=Date.now()+1500}else TM.cueAt=0;
 beep(ph==='work'?1000:ph==='rest'?600:800,ph==='work'?500:250);
}
function nextCue(){
 const t=TM.it.timer,c=CUES[t.cue];let txt;
 const gap=(t.cmin+Math.random()*Math.max(0,t.cmax-t.cmin))*1000;
 if(t.cue==='tempo'){txt=TM.cue==='BURST'?'CRUISE':'BURST';TM.cueAt=Date.now()+(txt==='BURST'?gap:6000)}
 else{let n=0;do{txt=c.list[Math.floor(Math.random()*c.list.length)];n++}while(txt===TM.cue&&c.list.length>1&&n<20);TM.cueAt=Date.now()+gap}
 TM.cue=txt;TM.show=txt;say(txt);beep(900,120);
}
function tmDraw(){
 const left=Math.max(0,Math.ceil((TM.end-Date.now())/1000)),ov=$('#tmOv');
 ov.className='open '+TM.ph;
 const t=TM.it.timer;
 $('#tmPhase').textContent=TM.ph==='ready'?'GET READY':TM.ph==='work'?(t.work>=60?'FIGHT':'GO'):TM.ph==='rest'?'REST':'DONE';
 $('#tmClock').textContent=TM.ph==='done'?'✓':fmt(TM.paused?Math.ceil(TM.left):left);
 $('#tmRound').textContent=TM.ph==='done'?'All rounds complete':'Round '+TM.round+' of '+t.rounds+' · '+fmt(t.work)+' work · '+t.rest+' s rest';
 $('#tmCue').textContent=TM.ph==='work'?TM.show:'';
 $('#tmMap').textContent=t.cue&&(TM.ph==='ready'||TM.ph==='rest')?CUES[t.cue].map:'';
 $('#tmPause').textContent=TM.ph==='done'?'Finish':TM.paused?'Resume':'Pause';
 return left;
}
function tmAdv(){
 const t=TM.it.timer;
 if(TM.ph==='ready')tmStart('work',1,t.work);
 else if(TM.ph==='work'){if(TM.round>=t.rounds||t.rest===0){TM.ph='done';beep(800,700)}else tmStart('rest',TM.round,t.rest)}
 else if(TM.ph==='rest')tmStart('work',TM.round+1,t.work);
}
function tmLoop(){
 if(!TM||TM.paused||TM.ph==='done')return;
 const left=tmDraw();
 if(TM.ph==='work'&&TM.cueAt&&Date.now()>=TM.cueAt){nextCue();tmDraw()}
 if(left<=3&&left>0&&TM.lastSec!==left){TM.lastSec=left;beep(700,120)}
 if(Date.now()>=TM.end){tmAdv();tmDraw()}
}
function openTimer(it0){
 TM={it:it0};tmStart('ready',1,5);
 $('#tmName').textContent=it0.name;
 clearInterval(tick);tick=setInterval(tmLoop,200);tmDraw();
 try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{lock=l}).catch(()=>{})}catch(e){}
}
function closeTimer(){
 clearInterval(tick);TM=null;$('#tmOv').className='';
 try{speechSynthesis.cancel()}catch(e){}
 try{if(lock){lock.release();lock=null}}catch(e){}
}
$('#tmPause').addEventListener('click',()=>{
 if(!TM)return;
 if(TM.ph==='done'){const l=ensureLog();if(l.done.indexOf(TM.it.id)<0)l.done.push(TM.it.id);save();closeTimer();render();return}
 if(TM.paused){TM.end=Date.now()+TM.left*1000;TM.paused=false;if(TM.ph==='work'&&TM.cueAt)TM.cueAt=Date.now()+1500}
 else{TM.left=Math.max(0,(TM.end-Date.now())/1000);TM.paused=true}
 tmDraw();
});
